# 按键循环的业务范围和新增规则默认值。
[key_rule]
min_interval = 0.05
max_interval = 3600.0
default_interval = 1.0
interval_step = 0.05
interval_decimals = 2

# 自动补给的百分比范围和默认快捷键。
[supply]
min_threshold = 1
max_threshold = 100
default_threshold = 50
default_health_key = "F10"
default_energy_key = "F11"

# 死亡回点允许填写的坐标范围。
[return_point]
min_coordinate = 0
max_coordinate = 999999

# 测试窗口生成器使用的参数。
[test_window]
title = "TLBB_天龙八部"
min_count = 1
max_count = 100
width = 420
height = 220
cascade_offset = 32

# 真实游戏窗口的扫描、按键调度和自动保存参数。
[game]
title_keywords = ["天龙八部", "TLBB"]
scan_interval_ms = 1000
scheduler_interval_ms = 20
key_hold_ms = 50
save_debounce_ms = 500
drag_hold_ms = 350

# 数组顺序就是固定配置槽：第 1 项永远是窗口1配置。
[[game.windows]]
id = "game-1"
enabled = false
supply_enabled = true
health_enabled = true
health_threshold = 50
health_key = "F10"
energy_enabled = true
energy_threshold = 50
energy_key = "F11"
return_enabled = false
map_name = "洛阳城"
x = 128
y = 256
rules = [
    {enabled = false, key = "F1", interval = 1.4},
    {enabled = false, key = "F2", interval = 1.0},
    {enabled = true, key = "Ctrl+W", interval = 1.0},
]

